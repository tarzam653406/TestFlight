<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daily Goals">
  <title>Daily Goals</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="prev" aria-label="Previous day">‹</button>
    <div class="date-block">
      <h1 id="date-title">Today</h1>
      <button class="link-btn" id="go-today" hidden>Back to today</button>
    </div>
    <button class="icon-btn" id="next" aria-label="Next day">›</button>
    <button class="icon-btn" id="open-settings" aria-label="Settings">⚙︎</button>
  </header>

  <main>
    <section class="capture card" aria-label="Capture a thought">
      <textarea id="capture-text" rows="3" placeholder="What's on your mind? e.g. “Finished the budget. Call the plumber tomorrow at 9, and sometime next month book the car service.”"></textarea>
      <div class="capture-actions">
        <button class="mic" id="mic" type="button" aria-label="Dictate" hidden>🎙️</button>
        <span class="status" id="capture-status" role="status"></span>
        <button class="primary" id="capture-send" type="button">Process</button>
      </div>
      <ul class="capture-result" id="capture-result"></ul>
    </section>

    <div id="sections"></div>

    <details class="card captures">
      <summary>Recent thoughts</summary>
      <ul id="captures-list"></ul>
    </details>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>Settings</h2>
      <label>App token
        <input id="token" type="password" autocomplete="current-password" placeholder="APP_TOKEN from the server">
      </label>
      <div class="row">
        <strong>Google Calendar</strong>
        <span id="google-state" class="muted"></span>
        <button type="button" id="google-btn"></button>
      </div>
      <div class="row">
        <strong>Sync</strong>
        <span id="sync-state" class="muted"></span>
        <button type="button" id="sync-now">Sync now</button>
      </div>
      <menu><button value="close" class="primary" id="save-settings">Done</button></menu>
    </form>
  </dialog>

  <template id="task-tpl">
    <li class="task">
      <label class="check"><input type="checkbox"><span class="title"></span></label>
      <span class="meta"></span>
      <button class="icon-btn small more" aria-label="Task options">⋯</button>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
